[dependencies]
comrak = { version = "0.59.0", features = ["shortcodes", "phoenix_heex"] }
pyo3 = { version = "0.30.1" }

[lib]
name = "comrak"
crate-type = ["cdylib"]

[package]
name = "comrak-ext"
version = "0.2.7"
edition = "2021"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
panic = "abort"
debug = false
strip = "symbols"
